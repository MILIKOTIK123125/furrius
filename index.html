.banner::before{content:"";position:absolute;inset:0;background:var(--ov)}
.bn{position:relative;padding:44px 40px;max-width:560px}
h1{margin:0;font-size:clamp(32px,6vw,52px);line-height:1.1;font-weight:800}h1 span{color:var(--accent)}
.bn p{margin:14px 0 26px;color:var(--dim);font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.start{display:inline-flex;align-items:center;gap:10px;padding:15px 38px;border:0;border-radius:999px;background:var(--btn);color:#fff;font:800 16px "Manrope",sans-serif;cursor:pointer;box-shadow:0 8px 28px rgba(110,110,200,.4);transition:transform .15s,filter .15s}
.start:hover{transform:translateY(-2px);filter:brightness(1.08)}
.status{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--card-line);font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#5be28b;box-shadow:0 0 8px #5be28b}
.sub{margin-top:14px;font-size:12px;color:var(--dim)}#msg{min-height:18px;color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:22px;padding:24px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.card h2{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:8px}
.card h3{margin:0 0 6px;font-size:16px}.card p{margin:0;color:var(--dim);font-size:14px}
.fi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--accent),var(--accent-2));margin-bottom:14px}
.sec{margin-top:20px}
.entry{display:flex;gap:16px;padding:16px;border-radius:16px;border:1px solid var(--card-line);margin-bottom:12px}
.entry:last-child{margin-bottom:0}
.thumb{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,#e58fb4,#9a8fe0)}
.meta{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.tag{padding:3px 10px;border-radius:8px;border:1px solid rgba(255,190,90,.55);color:#d99220;background:rgba(255,190,90,.1);font-size:11px;font-weight:800;letter-spacing:.4px}
.tag.fix{border-color:rgba(70,180,110,.55);color:#2fa464;background:rgba(110,220,150,.1)}
.date{color:var(--dim);font-size:12px}
.entry ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:13px}
.steps{counter-reset:s;display:grid;gap:12px}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;border:1px solid var(--card-line)}
.step::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-weight:800;font-size:14px}
.step b{display:block}.step span{color:var(--dim);font-size:13px}
.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:30px}
@media (max-width:560px){.bn{padding:28px 22px}.banner{min-height:420px}}
</style>
</head>
